<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Welcome page: live vs new</title>
<style>
  :root { color-scheme: dark; --gold:#F9A825; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #07070a; color: #cbcbd7; font: 14px/1.4 'DM Sans', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #222; }
  header b { color: #fff; }
  .seg { display: inline-flex; border: 1px solid #333; border-radius: 999px; overflow: hidden; }
  .seg button { background: none; border: 0; color: #cbcbd7; padding: 6px 14px; cursor: pointer; font: inherit; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #141006; font-weight: 700; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8a8a9a; }
  .pane h2 span { color: var(--gold); }
  .box { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: hidden; border: 1px solid #222; border-radius: 10px; background: #000; }
  .scaler { transform-origin: top center; }
  iframe { border: 0; background: #0b0b0f; display: block; }
</style></head>
<body>
<header>
  <b>Welcome page · live vs new</b>
  <span class="seg" role="group" aria-label="Device"><button data-w="1280" aria-pressed="true">Web</button><button data-w="390" aria-pressed="false">Phone</button></span>
  <span style="color:#5c5c6e">Preview only · the live site is unchanged</span>
</header>
<main>
  <div class="pane"><h2>Before · <span>live site</span></h2><div class="box"><div class="scaler"><iframe id="a" src="https://welcome.tradingrepublic.io/" title="Live page"></iframe></div></div></div>
  <div class="pane"><h2>After · <span>new build (preview)</span></h2><div class="box"><div class="scaler"><iframe id="b" src="/" title="New page"></iframe></div></div></div>
</main>
<script>
  let W = 1280;
  const frames = [...document.querySelectorAll('iframe')];
  function fit() {
    document.querySelectorAll('.box').forEach((box) => {
      const s = Math.min(1, (box.clientWidth - 4) / W);
      const sc = box.querySelector('.scaler'), f = sc.querySelector('iframe');
      f.style.width = W + 'px'; f.style.height = (box.clientHeight / s) + 'px';
      sc.style.transform = `scale(${s})`; sc.style.width = W + 'px';
    });
  }
  document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => {
    W = +b.dataset.w; document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b)); fit();
  });
  addEventListener('resize', fit); fit();
</script>
</body></html>
